name: Security CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kit_test
          POSTGRES_USER: kit
          POSTGRES_PASSWORD: kit_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kit -d kit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://kit:kit_test_password@127.0.0.1:5432/kit_test
      DB_SSL: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Audit high-severity vulnerabilities
        run: npm audit --audit-level=high

      - name: Check patch whitespace
        run: git diff --check
